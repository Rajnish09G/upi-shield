services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_USER: ${POSTGRES_USER:-upi_shield}
      POSTGRES_DB: ${POSTGRES_DB:-upi_shield}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:
  neo4jdata: